<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- Link previews: /app renders client-side, so scrapers read these defaults. -->
    <meta property="og:site_name" content="Stargazer" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stargazer · A clearer view of space" />
    <meta
      property="og:description"
      content="Explore the solar system in 3D: planets, moons, spacecraft and live satellites, placed with public data from NASA JPL, ESA and CelesTrak. Free, in your browser."
    />
    <meta property="og:image" content="https://stargazer-lab.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sunrise over Earth's horizon with the words A clearer view of space."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://stargazer-lab.vercel.app/og-image.jpg" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
