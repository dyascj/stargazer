name: Refresh Ephemeris Data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-ephemeris
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh ephemeris data from JPL HORIZONS
        run: node scripts/refresh-ephemeris.mjs

      - run: npx prettier --write src/lib/registry/bodies

      # Same gates as a pull request, short of the browser suite: data never lands unchecked.
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Commit and push if changed
        run: |
          git diff --quiet src/lib/registry/bodies/ && echo "No changes" && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/lib/registry/bodies/
          git commit -m "chore: refresh ephemeris data ($(date -u +%Y-%m-%d))"
          git push
